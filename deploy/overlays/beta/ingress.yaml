apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: www3.safespring.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beta-web
            port:
              number: 80
